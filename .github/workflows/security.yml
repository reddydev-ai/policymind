name: Security unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install "pytest==8.3.4" "fastapi==0.115.6" "pydantic==2.13.4"
      - name: Syntax check
        run: python -m compileall -q app tests
      - name: Run security tests
        run: python -m pytest -q tests/test_security.py
